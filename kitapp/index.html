<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>addEventListener('gesturestart', e => e.preventDefault()); // iOS Safari user-scalable=no-ды елемейді: екі саусақпен үлкейтуді тоқтатамыз</script>
<title>Kitapp</title>
<meta name="theme-color" content="#eef1f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav" aria-label="Негізгі мәзір">
  <button class="nav-brand" data-v="home"><i data-ic="book" data-s="22"></i><span>Kitapp</span></button>
  <button data-v="home"><i data-ic="home" data-s="22"></i><span>Басты бет</span></button>
  <button data-v="lib"><i data-ic="shelves" data-s="22"></i><span>Кітапхана</span></button>
  <button data-v="chat"><i data-ic="chat" data-s="22"></i><span>Чат</span></button>
  <button data-v="stats"><i data-ic="chart" data-s="22"></i><span>Аналитика</span></button>
  <button data-v="profile"><i data-ic="user" data-s="22"></i><span>Профиль</span></button>
</nav>

<main id="view"></main>

<!-- Кітап қосу -->
<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h3>Жаңа кітап</h3>
    <label>Файл (PDF немесе EPUB) <input name="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple></label>
    <label>Атауы <input name="title" placeholder="Бос қалдырсаң, файлдан алынады"></label>
    <label>Авторы <input name="author" placeholder="Бос қалдырсаң, файлдан алынады"></label>
    <label>Нұсқа аты <input name="vname" placeholder="мыс: Қазақша, Түпнұсқа, Қысқартылған"></label>
    <div class="row end">
      <button type="button" class="ghost" id="addCancel">Бас тарту</button>
      <button class="primary" value="ok">Сақтау</button>
    </div>
  </form>
</dialog>

<!-- Нұсқа қосу -->
<dialog id="verDlg">
  <form method="dialog" id="verForm">
    <h3>Нұсқа қосу</h3>
    <label>Түрі <select name="kind"><option value="original">Түпнұсқа</option><option value="translation">Аударма</option><option value="other">Басқа</option></select></label>
    <label>Атауы (міндетті емес) <input name="vname" placeholder="мыс: Қазақша аударма, 2-басылым"></label>
    <label>Файл (PDF немесе EPUB) <input name="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple required></label>
    <div class="row end"><button type="button" class="ghost" id="verCancel">Бас тарту</button><button class="primary" value="ok">Қосу</button></div>
  </form>
</dialog>

<!-- Бетбелгі -->
<dialog id="markDlg"><form method="dialog" id="markForm"><h3>Бетбелгі</h3><small class="muted" id="mkLabel"></small>
  <label>Атауы <input name="title" placeholder="мыс: Маңызды ой, Дәйексөз"></label>
  <div class="mk-colors" id="mkColors"></div>
  <label>Жазба <textarea name="note" rows="3" placeholder="Неге белгіледің?"></textarea></label>
  <div class="row" style="justify-content:space-between"><button type="button" class="ghost danger" id="mkDel">Өшіру</button>
    <div class="row"><button type="button" class="ghost" id="mkCancel">Бас тарту</button><button class="primary" value="ok">Сақтау</button></div></div></form></dialog>

<!-- Сөре және серия -->
<dialog id="shelfDlg"><form method="dialog" id="shelfForm"><h3>Сөре және серия</h3><div class="sd-body"></div>
  <div class="row end" style="margin-top:1rem"><button type="button" class="ghost" id="shelfCancel">Бас тарту</button><button class="primary" value="ok">Сақтау</button></div></form></dialog>

<!-- Сөре/серия жасау -->
<dialog id="colDlg" class="bsheet"><div class="fs-grip"></div>
  <div class="col-hd"><b></b><button type="button" class="icon-btn glass" id="colX" aria-label="Жабу"><i data-ic="x" data-s="20"></i></button></div>
  <div class="col-prev"></div>
  <label>Атауы <input id="colName" maxlength="60"></label>
  <label>Сипаттама <textarea id="colDesc" rows="3" placeholder="Бұл жинақ не туралы?"></textarea></label>
  <div id="colIconsWrap"><label style="margin-bottom:.4rem">Белгіше таңда</label><div class="col-icons" id="colIcons"></div></div>
  <button type="button" class="primary big" id="colOk" style="width:100%;margin-top:1rem"></button></dialog>

<!-- Кітаптарды таңдау -->
<dialog id="pickDlg" class="bsheet"><div class="fs-grip"></div><h3></h3><small class="muted">Басу арқылы таңда; серияда таңдау реті — кітап нөмірі.</small><div class="pk-body"></div>
  <div class="row end" style="margin-top:.8rem"><button type="button" class="ghost" id="pickCancel">Бас тарту</button><button type="button" class="primary" id="pickOk">Сақтау</button></div></dialog>

<!-- Кітапты өңдеу -->
<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3>Кітапты өңдеу</h3>
    <div class="e-cv"><div id="eCv"></div><div><label>Мұқаба суреті <input name="coverFile" type="file" accept="image/*"></label>
      <button type="button" id="eCvReset"><i data-ic="refresh" data-s="16"></i> Файлдан қайта алу</button></div></div>
    <div class="fgrid">
      <label class="wide">Атауы <input name="title" required></label>
      <label>Авторы <input name="author"></label>
      <label>Жанры <input name="genre" list="genres" placeholder="роман, ғылыми, өмірбаян…"></label>
      <label>Шыққан жылы <input name="year" type="number" min="0" max="2100"></label>
      <label>Тілі <select name="lang"><option value="">—</option><option value="kk">Қазақша</option><option value="ru">Орысша</option><option value="en">Ағылшынша</option><option value="tr">Түрікше</option><option value="other">Басқа</option></select></label>
      <label>Бет саны <input name="pages" type="number" min="1"></label>
      <label>ISBN <input name="isbn"></label>
      <label>Баспа <input name="publisher"></label>
      <label>Қайдан алынды <select name="source"><option value="">—</option><option>Электронды</option><option>Қағаз (өзімдікі)</option><option>Кітапхана</option><option>Сыйлыққа</option><option>Басқа</option></select></label>
      <label>Күйі <select name="status"><option value="plan">Жоспарда</option><option value="reading">Оқып жатырмын</option><option value="done">Оқыдым</option></select></label>
      <label>Оқи бастаған күні <input name="startDate" type="date"></label>
      <label>Аяқтаған күні <input name="finishDate" type="date"></label>
      <label>Серия <input name="series" placeholder="мыс: Абай жолы"></label>
      <label>Сериядағы нөмірі <input name="seriesNo" type="number" min="0" step="1"></label>
      <label class="wide">Сөрелер (үтірмен) <input name="tags" placeholder="психология, жазғы оқу"></label>
      <label class="wide">Не үшін оқимын? Мақсат, қысқаша сипаттама <textarea name="summary" rows="3"></textarea></label>
      <div class="wide"><div class="row" style="justify-content:space-between"><b>Файлдар (нұсқалар)</b><button type="button" id="eAddFile"><i data-ic="file-plus" data-s="16"></i> Файл қосу</button></div><div id="eFiles"></div></div>
    </div>
    <datalist id="genres"><option>Роман</option><option>Ғылыми</option><option>Өмірбаян</option><option>Өзін дамыту</option><option>Тарих</option><option>Информатика</option><option>Поэзия</option></datalist>
    <div class="row end"><button type="button" class="ghost" id="editCancel">Бас тарту</button><button class="primary" value="ok">Сақтау</button></div>
  </form>
</dialog>

<!-- Оқығыш -->
<section id="reader" hidden>
  <div class="r-bar">
    <button class="icon-btn glass" id="rMore" aria-label="Мәзір"><i data-ic="more" data-s="22"></i></button>
    <div class="r-top-status" id="rLeft"></div>
    <button class="icon-btn glass r-close" id="rClose" aria-label="Жабу"><i data-ic="x" data-s="26"></i></button>
    <span id="rTitle" hidden></span><span id="rAuthor" hidden></span><span id="rCh" hidden></span>
  </div>
  <div class="r-body">
    <div id="rStage"></div>
    <button class="r-side l" id="rPrev" aria-label="Алдыңғы бет"><i data-ic="chevron-left" data-s="26"></i></button>
    <button class="r-side r" id="rNext" aria-label="Келесі бет"><i data-ic="chevron-right" data-s="26"></i></button>
    <aside id="rPanel" hidden>
      <h4>Бетбелгілер</h4><div id="rMarks"></div>
      <h4>Ескертпелер</h4>
      <textarea id="rNoteText" placeholder="Осы жерге ескертпе жаз…"></textarea>
      <button class="primary" id="rNoteSave">Ескертпені сақтау</button>
      <div id="rNoteList"></div>
    </aside>
  </div>
  <div class="r-foot">
    <input type="range" id="rSlider" min="0" max="100" value="0" aria-label="Кітаптағы орын" hidden>
    <small class="rf-pct" id="rPosText"></small>
    <button class="reader-menu-btn" id="rTools" aria-label="Оқу құралдары"><i data-ic="list" data-s="28"></i></button>
  </div>
</section>
<dialog id="rSheet" class="bsheet"><div class="fs-grip"></div><div class="rs-body"></div></dialog>

<!-- Кітапхана сүзгілері (төменнен шығатын терезе) -->
<dialog id="fDlg" class="bsheet" aria-label="Сүзгілер"><div class="fs-grip"></div><h3>Не іздейміз</h3><div class="fs-body"></div></dialog>

<!-- Аудиоплеер (толық экран) -->
<section id="psheet" class="psheet" hidden aria-label="Аудиоплеер">
  <div class="ps-bg" id="psBg"></div>
  <div class="ps-in">
    <div class="ps-top"><button class="icon-btn glass" id="psDown" aria-label="Жабу"><i data-ic="chevron-down" data-s="24"></i></button>
      <div class="row" style="flex-wrap:nowrap"><button class="pill glass" id="psTxt" aria-label="Мәтінмен ілесу"><i data-ic="note" data-s="16"></i> Мәтін</button><button class="icon-btn glass" id="psMark" aria-label="Бетбелгі қою"><i data-ic="bookmark" data-s="20"></i></button>
      <button class="icon-btn glass" id="psSet" aria-label="Аудио жасау"><i data-ic="music" data-s="20"></i></button></div></div>
    <div class="ps-cover" id="psCover"></div>
    <div class="ps-text" id="psText"></div>
    <div class="ps-meta"><b id="psTitle"></b><span id="psAuthor"></span><button class="link" id="psCh"></button><small id="psMode"></small></div>
    <input type="range" id="psSeek" min="0" max="1" value="0" step="1" aria-label="Уақыт">
    <div class="ps-times"><span id="psT0">0:00</span><span id="psT1">-0:00</span></div>
    <div class="ps-ctl">
      <button class="icon-btn" id="psPrev" aria-label="Алдыңғы бөлім"><i data-ic="skip-back" data-s="28"></i></button>
      <button class="icon-btn skip" id="psRw" aria-label="15 секунд артқа"><i data-ic="rotate-ccw" data-s="34"></i><b>15</b></button>
      <button class="play-btn" id="psPlay" aria-label="Ойнату"></button>
      <button class="icon-btn skip" id="psFf" aria-label="30 секунд алға"><i data-ic="rotate-cw" data-s="34"></i><b>30</b></button>
      <button class="icon-btn" id="psNext" aria-label="Келесі бөлім"><i data-ic="skip-forward" data-s="28"></i></button>
    </div>
    <div class="ps-bot"><button class="ghost" id="psRate">1×</button><button class="ghost" id="psChs"><i data-ic="list" data-s="18"></i> Бөлімдер</button><button class="ghost" id="psSleep"></button></div>
  </div>
  <div class="ps-list glass" id="psList" hidden></div>
</section>

<div id="mini" class="mini glass" hidden></div>
<audio id="pAudio" preload="metadata" playsinline></audio>
<div id="toast" hidden></div>

<script src="icons.js"></script>
<script src="vendor/lib/pdf.min.js"></script>
<script src="vendor/lib/jszip.min.js"></script>
<script src="vendor/lib/epub.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="rag.js"></script>
<script src="kstats.js"></script>
<script src="kspeed.js"></script>
<script src="kconvert.js"></script>
<script src="app.js"></script>
<script src="covers.js"></script>
<script src="home.js"></script>
<script src="chat.js"></script>
<script src="prep.js"></script>
<script src="convert.js"></script>
<script src="ltts.js"></script>
<script src="audio.js"></script>
<script src="jobs.js"></script>
<script src="player.js"></script>
<script src="stats.js"></script>
<script src="speed.js"></script>
<script src="edit.js"></script>
<script src="shelves.js"></script>
<script src="marks.js"></script>
<script src="brand.js"></script>
<script src="profile.js"></script>
<script src="cloud.js"></script>
</body>
</html>
